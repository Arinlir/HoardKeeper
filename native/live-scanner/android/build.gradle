ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    // CameraX: preview + frame analysis, lifecycle-aware (pauses with the app).
    cameraxVersion = project.hasProperty('cameraxVersion') ? rootProject.ext.cameraxVersion : '1.4.2'
    // ML Kit text recognition, BUNDLED model: works offline and without Google
    // Play Services, at the cost of ~4 MB per ABI in the APK. The unbundled
    // "play-services-mlkit-text-recognition" is smaller but downloads the model
    // on first use and needs Play Services.
    mlkitTextVersion = project.hasProperty('mlkitTextVersion') ? rootProject.ext.mlkitTextVersion : '16.0.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "eu.arinvault.binderwyrm.livescanner"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation "com.google.mlkit:text-recognition:$mlkitTextVersion"
    // Both arrive transitively via CameraX; declared because this code uses
    // them directly (ListenableFuture, @OptIn for ImageProxy.getImage()).
    implementation "com.google.guava:listenablefuture:1.0"
    implementation "androidx.annotation:annotation-experimental:1.4.1"
}
